<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="beer-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-gradient)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800"/>
    <path d="M160 0v500M320 0v500M480 0v500M640 0v500"/>
  </g>

  <!-- Central Brewery / Beer Icon -->
  <g transform="translate(400, 220)" text-anchor="middle">
    <!-- Outer decorative ring -->
    <circle r="70" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Beer Mug Icon -->
    <path d="M-22 -30 h44 v55 a12 12 0 0 1 -12 12 h-20 a12 12 0 0 1 -12 -12 z" fill="url(#beer-gradient)"/>
    <!-- Mug handle -->
    <path d="M22 -15 h14 a10 10 0 0 1 10 10 v15 a10 10 0 0 1 -10 10 h-14" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Foam top -->
    <path d="M-26 -30 q5 -10 13 -4 q5 -10 13 0 q5 -10 13 0 q5 -8 13 4 z" fill="#fef3c7"/>

    <!-- Text Label -->
    <text y="110" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#a1a1aa" letter-spacing="2">
      MARYLAND BEER ATLAS
    </text>
    <text y="135" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#71717a">
      Craft Taproom &amp; Brewery
    </text>
  </g>
</svg>
